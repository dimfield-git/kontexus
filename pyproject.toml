[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kontexus"
version = "0.1.0"
description = "LLM Context Manager"
requires-python = ">=3.10"
dependencies = [
    "typer[all]>=0.9.0",
    "pydantic>=2.0.0",
    "pyperclip>=1.8.0",
]

[project.scripts]
kontexus = "kontexus.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/kontexus"]
